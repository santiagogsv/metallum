plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
	accessWidenerPath = file("src/main/resources/metallum.accesswidener")
}

repositories {
	maven { url "https://api.modrinth.com/maven" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:sodium:${project.sodium_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Required Swift backend; build and package the matching library together.
tasks.register('buildNative', Exec) {
    group = 'build'
    description = 'Build the Swift Metal device bridge for the host macOS architecture'
    inputs.files('native/MetallumNative.swift', 'native/MetalResources.swift', 'native/MetalShaders.swift', 'native/MetalPipelines.swift', 'native/MetalSubmission.swift', 'native/MetalDiagnostics.swift', 'native/MetalUpscaling.swift', 'native/MetalCopies.swift', 'native/MetalRenderPass.swift', 'native/MetalDraws.swift', 'native/MetalPresentation.swift')
    inputs.property('nativeTarget', 'arm64-apple-macosx27.0')
    inputs.property('swiftLanguageMode', '6')
    outputs.file(layout.buildDirectory.file('native/libmetallum_native.dylib'))
    doFirst {
        if (!System.getProperty('os.name').toLowerCase().contains('mac')) {
            throw new GradleException('buildNative requires macOS and the Swift toolchain')
        }
        file('build/native').mkdirs()
    }
    commandLine 'xcrun', 'swiftc', '-parse-as-library', '-emit-library', '-O',
            '-swift-version', '6', '-target', 'arm64-apple-macosx27.0',
            '-module-cache-path', file('build/native/module-cache').absolutePath,
            '-Xlinker', '-install_name', '-Xlinker', '@rpath/libmetallum_native.dylib',
            '-module-name', 'MetallumNative', 'native/MetallumNative.swift', 'native/MetalResources.swift', 'native/MetalShaders.swift', 'native/MetalPipelines.swift', 'native/MetalSubmission.swift', 'native/MetalDiagnostics.swift', 'native/MetalUpscaling.swift', 'native/MetalCopies.swift', 'native/MetalRenderPass.swift', 'native/MetalDraws.swift', 'native/MetalPresentation.swift',
            '-o', file('build/native/libmetallum_native.dylib').absolutePath
}

tasks.register('checkNative', Exec) {
    group = 'verification'
    description = 'Verify Swift Metal descriptor policy and Java/C ownership without a GPU'
    dependsOn 'buildNative', 'jar'
    environment 'METALLUM_TEST_JAR', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    environment 'METALLUM_TEST_CLASSPATH', sourceSets.main.runtimeClasspath.asPath
    environment 'JAVA_HOME', System.getProperty('java.home')
    commandLine 'sh', 'native/tests/check.sh'
}

// Ship exactly the native library built with this jar. Also available to development launches.
tasks.named('processResources') {
    dependsOn tasks.named('buildNative')
    from(layout.buildDirectory.file('native/libmetallum_native.dylib')) {
        into 'native/macos-arm64'
    }
}
